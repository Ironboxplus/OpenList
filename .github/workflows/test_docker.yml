name: Beta Release (Docker)

on:
  workflow_dispatch:
    inputs:
      frontend_repo:
        description: 'Frontend repo, e.g. Ironboxplus/OpenList-Frontend'
        required: false
        default: 'Ironboxplus/OpenList-Frontend'
        type: string
      frontend_channel:
        description: 'Frontend release channel to build'
        required: false
        default: rolling
        type: choice
        options:
          - rolling
          - latest
          - both
  push:
    branches:
      - feat/dynamic-frontend
      - canary

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHCR_ORG_NAME: ${{ vars.GHCR_ORG_NAME || 'ironboxplus' }}
  FRONTEND_REPO: ${{ github.event.inputs.frontend_repo || vars.FRONTEND_REPO || 'Ironboxplus/OpenList-Frontend' }}
  REGISTRY: ghcr.io
  RELEASE_PLATFORMS: 'linux/amd64'

jobs:
  release_docker:
    name: Build and release GHCR images (x64, front-${{ matrix.frontend_channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        frontend_channel: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.frontend_channel == 'both' && fromJSON('["rolling","latest"]') || fromJSON(format('["{0}"]', github.event.inputs.frontend_channel))) || fromJSON('["rolling"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download musl toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build.sh prepare docker-multiplatform

      - name: Build Go binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_VERSION: ${{ matrix.frontend_channel }}
          FRONTEND_REPO: ${{ env.FRONTEND_REPO }}
        run: bash build.sh beta docker-multiplatform

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR images
        shell: bash
        env:
          FRONTEND_CHANNEL: ${{ matrix.frontend_channel }}
        run: |
          set -euo pipefail

          push_image() {
            local image_name="$1"
            local base_image_tag="$2"
            shift 2

            local image="${REGISTRY}/${GHCR_ORG_NAME}/${image_name}"
            local -a tags
            if [ "${GITHUB_REF_NAME}" = "canary" ]; then
              # The canary branch is only for the node that runs :canary; it must
              # never move a tag the other nodes follow.
              tags=(--tag "${image}:canary")
            else
              tags=(--tag "${image}:front-${FRONTEND_CHANNEL}")
              if [ "${FRONTEND_CHANNEL}" = "latest" ]; then
                tags+=(--tag "${image}:latest")
              fi
            fi

            docker buildx build \
              --file Dockerfile.ci \
              --platform "${RELEASE_PLATFORMS}" \
              --build-arg "BASE_IMAGE_TAG=${base_image_tag}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$@" \
              "${tags[@]}" \
              --push \
              .
          }

          push_image openlist base
          push_image openlist-ffmpeg ffmpeg \
            --build-arg INSTALL_FFMPEG=true
          push_image openlist-aria2 aria2 \
            --build-arg INSTALL_ARIA2=true
          push_image openlist-aio aio \
            --build-arg INSTALL_FFMPEG=true \
            --build-arg INSTALL_ARIA2=true
