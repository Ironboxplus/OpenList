name: test-ours

# Tests of the packages this fork owns (sync jobs, rclonefs, cluster, 115 Open).
# Only branches whose go.mod uses public replaces can build here; feat/cfs needs
# ../cfs, ../rclone-fork and ../115-sdk-go (see the guard step).

on:
  push:
    branches: ["main", "dev/**", "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ours-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"
  # pipe = fall through to the next proxy on any error (proxy.golang.org drops streams now and then)
  GOPROXY: "https://proxy.golang.org|https://goproxy.cn|direct"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sync
            pkgs: ./internal/syncjob ./internal/rclonefs ./cmd
          - name: cluster-emu115
            tags: emu115
            pkgs: ./internal/cluster ./drivers/115_open ./internal/op
          - name: handles
            pkgs: ./server/handles
          # Subtitle extraction reads real MKV/MP4 files made by ffmpeg and
          # mkvmerge and compares with what ffmpeg writes for the same track.
          - name: subextract
            pkgs: ./internal/media/ebml ./internal/media/check ./internal/media/subextract
            apt: ffmpeg mkvtoolnix gpac
          # Everything else, so a merge of upstream is checked against the
          # tests of every package it touched (blackbox needs its own tag and
          # runs in the job below).
          - name: all
            pkgs: ./...
    steps:
      - uses: actions/checkout@v4
      - name: Guard, local replaces cannot build here
        run: |
          if grep -nE '^replace .*=> *\.\.?/' go.mod; then
            echo "::error::go.mod replaces a module with a local path; this branch cannot build in CI yet"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Embedded frontend placeholder
        run: |
          mkdir -p public/dist
          [ -e public/dist/index.html ] || echo '<!doctype html>' > public/dist/index.html
      - name: Install media tools
        if: matrix.apt != ''
        run: |
          # Ubuntu's own archive only, and none of the runner's other sources
          # (Microsoft, PPAs on launchpad): on 2026-11-11 the runners could not
          # resolve *.ubuntu.com or launchpad for over an hour, and apt waited on
          # each of them until the job was cancelled. The archive is read through
          # a mirror list (apt-transport-mirror(1)), tried by priority and the
          # next one when one fails: on 2026-11-12 kernel.org's mirror stopped
          # answering half way through the downloads.
          printf '%s\tpriority:%s\n' http://mirrors.edge.kernel.org/ubuntu/ 1 \
            http://azure.archive.ubuntu.com/ubuntu/ 2 http://archive.ubuntu.com/ubuntu/ 3 > /tmp/apt-mirrors.txt
          c=$(. /etc/os-release && echo "$VERSION_CODENAME")
          for p in "$c" "$c-updates" "$c-security"; do
            echo "deb mirror+file:/tmp/apt-mirrors.txt $p main universe"
          done > /tmp/apt-sources.list
          apt_opts="-o Dir::Etc::sourcelist=/tmp/apt-sources.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=3"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y -qq ${{ matrix.apt }}
          ffmpeg -hide_banner -version | head -1
          mkvmerge --version
          MP4Box -version 2>&1 | head -1
      - name: go build, go vet
        env:
          TAGS: ${{ matrix.tags }}
          PKGS: ${{ matrix.pkgs }}
        run: |
          go build -tags "$TAGS" $PKGS
          go vet -tags "$TAGS" $PKGS
      - name: go test
        env:
          TAGS: ${{ matrix.tags }}
          PKGS: ${{ matrix.pkgs }}
          # the extraction tests fail, rather than skip, when ffmpeg or mkvmerge
          # is missing; only the job that installs them asks for that
          SUBEXTRACT_REQUIRE: ${{ matrix.apt != '' && '1' || '0' }}
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -tags "$TAGS" $PKGS 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Tail of the log
        if: failure()
        run: tail -c 200000 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test-tail.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.name }}
          path: ${{ runner.temp }}/test-tail.log
          retention-days: 7
          if-no-files-found: ignore

  # Real server processes against the 115 emulator. The binary is built with
  # -tags emu115 and only ever used here.
  cluster-blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guard, local replaces cannot build here
        run: |
          if grep -nE '^replace .*=> *\.\.?/' go.mod; then
            echo "::error::go.mod replaces a module with a local path; this branch cannot build in CI yet"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Embedded frontend placeholder
        run: |
          mkdir -p public/dist
          [ -e public/dist/index.html ] || echo '<!doctype html>' > public/dist/index.html
      - name: Build the emu115 binary
        run: go build -tags emu115 -buildvcs=false -o "$RUNNER_TEMP/bin-new" .
      - name: go test -tags blackbox
        env:
          CLUSTER_BB_BIN: ${{ runner.temp }}/bin-new
          CLUSTER_BB_DIR: ${{ runner.temp }}/cluster-bb
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -tags "blackbox emu115" -v ./internal/cluster/blackbox/ 2>&1 | tee "$RUNNER_TEMP/bb.log"
      - name: Tail of the log
        if: failure()
        run: tail -c 200000 "$RUNNER_TEMP/bb.log" > "$RUNNER_TEMP/bb-tail.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-cluster-blackbox
          path: ${{ runner.temp }}/bb-tail.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-cluster-blackbox-nodes
          path: ${{ runner.temp }}/cluster-bb/**/stdout.log
          retention-days: 3
          if-no-files-found: ignore
